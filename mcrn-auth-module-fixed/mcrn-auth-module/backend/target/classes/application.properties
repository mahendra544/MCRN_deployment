spring.application.name=mcrn-auth-module
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mcrn_auth?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Sanju@8555}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT: replace this in production with a long random secret
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-to-a-long-random-value-please}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Admin bootstrap credentials. Change before deployment.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.admin.email=${ADMIN_EMAIL:admin@mcrn.local}

# SMTP. For local development the application logs OTPs if mail is not configured.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:4173,http://127.0.0.1:4173}
