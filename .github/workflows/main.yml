name: Backend Package JSON Check

on:
  push:
    branches:
      - vercel-deployment
    paths:
      - 'backend/**'
      - '.github/workflows/main.yml'
  workflow_dispatch:

jobs:
  check-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check backend package.json
        run: node -e "JSON.parse(require('fs').readFileSync('backend/package.json', 'utf8')); console.log('package.json is valid')"
